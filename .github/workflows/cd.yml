name: CD — Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  validate-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate model code integrity
        run: |
          python -c "
          from src.modeling.xgboost_trainer import XGBoostTrainer
          from src.modeling.lstm_trainer import BiLSTMTrainer
          from src.modeling.transformer_trainer import TransformerTrainer
          from src.modeling.ensemble import HybridEnsemble
          from src.modeling.calibration import ProbabilityCalibrator, ThresholdOptimizer
          print('✅ All model modules validated')
          "

      - name: Validate serving code
        run: |
          python -c "
          from src.serving.model_server import app, ModelRegistry
          print('✅ Serving module validated')
          "

  build-docker:
    needs: validate-models
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Health check (dry run)
        run: |
          echo "✅ Docker image built and pushed successfully"
          echo "Deploy with: docker pull ghcr.io/${{ github.repository }}:latest"
